<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — Back-office 417 France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-page">

<main class="login">
  <div class="login__card">
    <p class="login__brand">417 France</p>
    <h1>Back-office</h1>
    <p class="login__intro">Connectez-vous pour gérer le stock, les clients et les livraisons.</p>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Identifiant</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="login__error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn--block" id="login-submit">Se connecter</button>
    </form>

    <p class="login__hint">
      Mot de passe oublié ? Depuis le dossier du projet :
      <code>node scripts/reset-password.js &lt;nouveau mot de passe&gt;</code>
    </p>
  </div>
  <p class="login__back"><a href="/">← Retour à la boutique</a></p>
</main>

<script>
(function () {
  'use strict';
  var form = document.getElementById('login-form');
  var error = document.getElementById('login-error');
  var submit = document.getElementById('login-submit');

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Connexion…';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    }).then(function (response) {
      return response.json().then(function (data) { return { ok: response.ok, data: data }; });
    }).then(function (result) {
      if (!result.ok) throw new Error(result.data.error || 'Connexion impossible.');
      window.location.href = '/admin';
    }).catch(function (err) {
      error.textContent = err.message;
      error.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Se connecter';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    });
  });
})();
</script>
</body>
</html>
